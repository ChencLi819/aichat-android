<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Microsoft YaHei UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .cap{fill:#f0fdf9;stroke:#10b981;stroke-width:1.5;rx:12}
    .uni{fill:#eef4ff;stroke:#2563eb;stroke-width:1.5}
    .mdl{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .pnl{fill:#f0fdf9;stroke:#10b981;stroke-width:2}
    .ctx{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 4}
    .t1{font-size:15px;font-weight:bold;fill:#0f172a}
    .t2{font-size:11.5px;fill:#64748b}
    .grp{font-size:12px;font-weight:bold;fill:#94a3b8}
    .ln{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    .dsh{stroke:#b6c2d4;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}
  </style>

  <text x="24" y="34" class="grp">采集（只读屏幕，不 hook、不注入）</text>
  <rect x="24" y="52" width="252" height="76" rx="12" class="cap"/>
  <text x="150" y="84" text-anchor="middle" class="t1">无障碍读节点</text>
  <text x="150" y="106" text-anchor="middle" class="t2">Android · 各聊天 App 适配器</text>

  <rect x="24" y="152" width="252" height="76" rx="12" class="cap"/>
  <text x="150" y="184" text-anchor="middle" class="t1">截屏 → 离线 OCR</text>
  <text x="150" y="206" text-anchor="middle" class="t2">Android 兜底 · 中文离线模型</text>

  <rect x="24" y="252" width="252" height="76" rx="12" class="cap"/>
  <text x="150" y="284" text-anchor="middle" class="t1">框选区域截屏 → 视觉读图</text>
  <text x="150" y="306" text-anchor="middle" class="t2">Windows · 任意聊天客户端</text>

  <path d="M276 90 C 320 90, 320 150, 348 152" class="ln"/>
  <path d="M276 190 L 348 185" class="ln"/>
  <path d="M276 290 C 320 290, 320 220, 348 218" class="ln"/>

  <rect x="356" y="112" width="230" height="120" rx="12" class="uni"/>
  <text x="471" y="150" text-anchor="middle" class="t1">统一消息列表</text>
  <text x="471" y="176" text-anchor="middle" class="t2">会话标题 · 谁说的 · 说了什么</text>
  <text x="471" y="198" text-anchor="middle" class="t2">下游全部通用，换 App 不换内核</text>

  <rect x="356" y="330" width="230" height="86" rx="12" class="ctx"/>
  <text x="471" y="362" text-anchor="middle" class="t1">本地上下文</text>
  <text x="471" y="386" text-anchor="middle" class="t2">知识库 · 联系人档案 · 聊天历史</text>
  <text x="471" y="404" text-anchor="middle" class="t2">只存在本机，命中才注入</text>

  <path d="M586 150 L 658 122" class="ln"/>
  <path d="M586 190 L 658 216" class="ln"/>
  <path d="M586 356 C 630 356, 630 130, 658 112" class="dsh"/>

  <rect x="666" y="52" width="290" height="108" rx="12" class="mdl"/>
  <text x="811" y="84" text-anchor="middle" class="t1">判断模型</text>
  <text x="811" y="108" text-anchor="middle" class="t2">真实意图 · 危险等级 · 该不该马上回</text>
  <text x="811" y="130" text-anchor="middle" class="t2">一次请求给出全部判断，带把握度</text>

  <rect x="666" y="186" width="290" height="72" rx="12" class="mdl"/>
  <text x="811" y="216" text-anchor="middle" class="t1">生成模型</text>
  <text x="811" y="240" text-anchor="middle" class="t2">按判断起草 3 条口语化候选回复</text>

  <path d="M811 160 L 811 178" class="ln"/>
  <path d="M770 258 L 770 296" class="ln"/>
  <text x="752" y="282" text-anchor="end" class="t2">判断排序</text>

  <rect x="666" y="302" width="290" height="134" rx="12" class="pnl"/>
  <text x="811" y="334" text-anchor="middle" class="t1">悬浮面板</text>
  <text x="811" y="358" text-anchor="middle" class="t2">候选 #1 / #2 / #3 · 占比排序</text>
  <text x="811" y="380" text-anchor="middle" class="t2">一键复制 · 一键填入输入框</text>
  <text x="811" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#059669">发送键永远由你自己点</text>
</svg>
